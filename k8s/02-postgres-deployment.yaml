apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: streamsentinel
  labels:
    app: streamsentinel
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamsentinel
      component: database
  template:
    metadata:
      labels:
        app: streamsentinel
        component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: streamsentinel
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: streamsentinel-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: streamsentinel
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U streamsentinel
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U streamsentinel
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: streamsentinel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: streamsentinel
  labels:
    app: streamsentinel
    component: database
spec:
  type: ClusterIP
  selector:
    app: streamsentinel
    component: database
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
