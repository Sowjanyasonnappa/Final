apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamsentinel
  namespace: streamsentinel
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
  - host: api.streamsentinel.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: streamsentinel-backend
            port:
              number: 8000
  - host: prometheus.streamsentinel.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
  - host: grafana.streamsentinel.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: streamsentinel-ingress
  namespace: streamsentinel
spec:
  type: LoadBalancer
  selector:
    app: nginx-ingress
  ports:
  - port: 80
    targetPort: 80
    name: http
  - port: 443
    targetPort: 443
    name: https
