apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: streamsentinel
  labels:
    app: streamsentinel
    component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamsentinel
      component: grafana
  template:
    metadata:
      labels:
        app: streamsentinel
        component: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
          name: web
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: grafana-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: streamsentinel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: streamsentinel
spec:
  type: ClusterIP
  selector:
    app: streamsentinel
    component: grafana
  ports:
  - port: 3000
    targetPort: 3000
    name: web
